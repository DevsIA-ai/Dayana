<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generar Invitación · Dayana Ximena · Mis XV Años</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#1f7a5c; --gold-dark:#0d4a37; --gold-light:#cfe8dc;
    --cream:#faf7f0; --dark:#0f2a20; --text:#1c2e26;
    --text-muted:#6e8579; --serif:'Cormorant Garamond',serif;
    --script:'Great Vibes',cursive; --sans:'Montserrat',sans-serif;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family:var(--sans);
    background:linear-gradient(155deg,#123526 0%,#1f4d3a 55%,#0a1f17 100%);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:2rem 1rem;
  }

  .card {
    background:#fff;
    border-radius:12px;
    padding:2.8rem 2.4rem 2.4rem;
    width:100%; max-width:460px;
    box-shadow:0 32px 80px rgba(0,0,0,.55);
    text-align:center;
  }

  .card-eyebrow {
    font-size:.52rem; letter-spacing:.44em; text-transform:uppercase;
    color:var(--gold); margin-bottom:.6rem;
  }
  .card-hr {
    width:40px; height:1px; margin:.6rem auto;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .card-title {
    font-family:var(--script);
    font-size:clamp(2rem,6vw,2.8rem);
    color:var(--text); line-height:1.1;
    margin-bottom:.2rem;
  }
  .card-sub {
    font-size:.52rem; letter-spacing:.38em; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:2rem;
  }

  /* FORM */
  .form-group { text-align:left; margin-bottom:1.2rem; }
  .form-group label {
    display:block;
    font-size:.55rem; letter-spacing:.3em; text-transform:uppercase;
    color:var(--gold-dark); margin-bottom:.45rem;
  }
  .form-group input, .form-group select {
    width:100%;
    padding:.72rem 1rem;
    border:1px solid rgba(201,169,110,.45);
    border-radius:8px;
    font-family:var(--serif); font-size:1rem;
    color:var(--text);
    background:#faf6ef;
    outline:none;
    transition:border-color .25s;
  }
  .form-group input:focus, .form-group select:focus {
    border-color:var(--gold);
  }
  .form-group input::placeholder { color:#bba990; }

  .btn-row2 { display:flex; gap:.75rem; margin-top:.75rem; }
  .btn-reset, .btn-sheet {
    flex:1; padding:.7rem;
    border:none; border-radius:50px;
    font-family:var(--sans);
    font-size:.58rem; letter-spacing:.22em; text-transform:uppercase;
    cursor:pointer; text-align:center; text-decoration:none;
    display:flex; align-items:center; justify-content:center;
    transition:background .3s, transform .15s;
  }
  .btn-reset {
    background:transparent; border:1px solid var(--gold-dark); color:var(--gold-dark);
  }
  .btn-reset:hover { background:rgba(201,169,110,.1); }
  .btn-sheet { background:var(--dark); color:#fff; }
  .btn-sheet:hover { background:#000; }
  .btn-reset:active, .btn-sheet:active { transform:scale(.97); }

  .btn-generar {
    width:100%; padding:.85rem;
    background:var(--gold);
    border:none; border-radius:50px;
    color:#fff; font-family:var(--sans);
    font-size:.6rem; letter-spacing:.3em; text-transform:uppercase;
    cursor:pointer; margin-top:.4rem;
    transition:background .3s, transform .15s;
  }
  .btn-generar:hover { background:var(--gold-dark); }
  .btn-generar:active { transform:scale(.98); }

  /* RESULTADO */
  #resultado {
    display:none;
    margin-top:1.8rem;
    border-top:1px solid rgba(201,169,110,.25);
    padding-top:1.6rem;
  }
  #resultado.visible { display:block; }

  .res-label {
    font-size:.52rem; letter-spacing:.35em; text-transform:uppercase;
    color:var(--gold); margin-bottom:.75rem;
  }
  .res-family {
    font-family:var(--script);
    font-size:clamp(1.5rem,5vw,2rem);
    color:var(--text); margin-bottom:.2rem;
  }
  .res-boletos {
    font-size:.58rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:1.1rem;
  }

  .url-box {
    background:#faf6ef;
    border:1px solid rgba(201,169,110,.35);
    border-radius:8px;
    padding:.9rem 1rem;
    font-family:var(--serif); font-size:.85rem;
    color:var(--text);
    word-break:break-word; white-space:pre-wrap; text-align:left;
    line-height:1.6;
    margin-bottom:1rem;
    user-select:all;
  }

  .btn-row {
    display:flex; gap:.75rem;
  }
  .btn-copy, .btn-open {
    flex:1; padding:.7rem;
    border:none; border-radius:50px;
    font-family:var(--sans);
    font-size:.58rem; letter-spacing:.26em; text-transform:uppercase;
    cursor:pointer;
    transition:background .3s, transform .15s;
  }
  .btn-copy {
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-dark);
  }
  .btn-copy:hover { background:rgba(201,169,110,.1); }
  .btn-copy.copied { background:rgba(201,169,110,.15); color:var(--gold); }
  .btn-open {
    background:var(--gold); color:#fff;
  }
  .btn-open:hover { background:var(--gold-dark); }
  .btn-copy:active, .btn-open:active { transform:scale(.97); }

  @media(max-width:480px){
    .card { padding:2rem 1.4rem 1.8rem; }
    .btn-row { flex-direction:column; }
  }
</style>
</head>
<body>

<a href="../../Web/" style="display:block;margin-bottom:1.5rem;text-align:center;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55);text-decoration:none">← Ver más invitaciones</a>

<div class="card">
  <p class="card-eyebrow">✦ &nbsp;Generador de Invitaciones &nbsp;✦</p>
  <div class="card-hr"></div>
  <h1 class="card-title">Dayana Ximena</h1>
  <p class="card-sub">19 · 09 · 2026</p>

  <div class="form-group">
    <label>¿Cómo se le llama?</label>
    <select id="inputTipo">
      <option value="familia" selected>Familia</option>
      <option value="estimado">Estimado</option>
      <option value="estimada">Estimada</option>
    </select>
  </div>

  <div class="form-group">
    <label>Nombre</label>
    <input type="text" id="inputFamilia" placeholder="Ej: García López" autocomplete="off">
  </div>

  <div class="form-group">
    <label>Número de boletos</label>
    <select id="inputBoletos">
      <option value="1">1 boleto</option>
      <option value="2">2 boletos</option>
      <option value="3" selected>3 boletos</option>
      <option value="4">4 boletos</option>
      <option value="5">5 boletos</option>
      <option value="6">6 boletos</option>
      <option value="7">7 boletos</option>
      <option value="8">8 boletos</option>
      <option value="9">9 boletos</option>
      <option value="10">10 boletos</option>
    </select>
  </div>

  <button class="btn-generar" onclick="generar()">Generar Invitación &nbsp;✦</button>

  <!-- Resultado -->
  <div id="resultado">
    <p class="res-label">Mensaje generado para:</p>
    <p class="res-family" id="resFamilyName"></p>
    <p class="res-boletos" id="resBoletosText"></p>
    <p class="res-label" style="margin-top:.25rem">Esto es lo que se copiará:</p>
    <div class="url-box" id="resMensaje"></div>
    <div class="btn-row">
      <button class="btn-copy" id="btnCopy" onclick="copiarMensaje()">Copiar mensaje</button>
      <button class="btn-open" onclick="abrirInvitacion()">Abrir ✦</button>
    </div>
    <div class="btn-row2">
      <button class="btn-reset" onclick="resetForm()">Generar otra invitación</button>
      <a class="btn-sheet" href="https://docs.google.com/spreadsheets/d/1FOfaxcX77brwfzwsoo11b7QoVVxOiAZhAegL6upRPg4/edit?usp=sharing" target="_blank" rel="noopener">Ver confirmaciones</a>
    </div>
  </div>
</div>

<script>
  var urlGenerada = '';
  var mensajeGenerado = '';
  var TIPO_LABELS = { familia:'Familia', estimado:'Estimado', estimada:'Estimada' };

  function generar(){
    var tipo = document.getElementById('inputTipo').value;
    var tipoLabel = TIPO_LABELS[tipo] || 'Familia';
    var familia = document.getElementById('inputFamilia').value.trim();
    var boletos = document.getElementById('inputBoletos').value;

    if(!familia){
      document.getElementById('inputFamilia').focus();
      document.getElementById('inputFamilia').style.borderColor = '#c97a6e';
      setTimeout(function(){ document.getElementById('inputFamilia').style.borderColor = ''; }, 1500);
      return;
    }

    var base;
    if(window.location.href.indexOf('generar.html') !== -1){
      base = window.location.href.replace('generar.html','index.html');
    } else {
      base = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/index.html');
    }
    urlGenerada = base + '?f=' + encodeURIComponent(familia) + '&b=' + boletos + '&t=' + tipo;

    var n = parseInt(boletos, 10);
    var personas = n === 1 ? 'PERSONA' : 'PERSONAS';
    mensajeGenerado =
      '¡Hola! ✨ ' + tipoLabel + ' ' + familia + '\n' +
      'Te invito a mis XV años.👸\n' +
      'Espero poder contar con tu presencia.💐\n\n' +
      'PASE PARA ' + n + ' ' + personas + ' 🎟️\n' +
      'Click para ver la invitación.💌\n' +
      urlGenerada + '\n\n' +
      'Por favor confirma tu asistencia.';

    document.getElementById('resFamilyName').textContent = tipoLabel + ' ' + familia;
    document.getElementById('resBoletosText').textContent = n + (n === 1 ? ' boleto' : ' boletos');
    document.getElementById('resMensaje').textContent = mensajeGenerado;

    var res = document.getElementById('resultado');
    res.classList.add('visible');
    res.scrollIntoView({ behavior:'smooth', block:'nearest' });

    var btn = document.getElementById('btnCopy');
    btn.textContent = 'Copiar mensaje';
    btn.classList.remove('copied');
  }

  function copiarMensaje(){
    if(!mensajeGenerado) return;
    navigator.clipboard.writeText(mensajeGenerado).then(function(){
      var btn = document.getElementById('btnCopy');
      btn.textContent = '¡Copiado! ✓';
      btn.classList.add('copied');
      setTimeout(function(){ btn.textContent = 'Copiar mensaje'; btn.classList.remove('copied'); }, 2500);
    });
  }

  function abrirInvitacion(){
    if(urlGenerada) window.open(urlGenerada, '_blank');
  }

  function resetForm(){
    document.getElementById('inputTipo').value = 'familia';
    document.getElementById('inputFamilia').value = '';
    document.getElementById('inputBoletos').value = '3';
    document.getElementById('resultado').classList.remove('visible');
    window.scrollTo({ top:0, behavior:'smooth' });
    document.getElementById('inputFamilia').focus();
  }

  // Permitir Enter en el campo de familia
  document.getElementById('inputFamilia').addEventListener('keydown', function(e){
    if(e.key === 'Enter') generar();
  });
</script>
</body>
</html>
